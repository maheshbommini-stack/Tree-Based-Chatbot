<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Support Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <header>
            <h1>🌳 Student Support Chatbot</h1>
            <p>Tree-Based Chatbot</p>
        </header>

        <main id="chatBox">

            <div class="bot-message">
                👋 Hello! I'm your Student Support Chatbot.
                <br><br>
                Please select a category below.
            </div>

        </main>

        <div id="options" class="options">

            <button onclick="college()">
                🏫 College
            </button>

            <button onclick="courses()">
                📚 Courses
            </button>

            <button onclick="exams()">
                📝 Examinations
            </button>

            <button onclick="services()">
                🎓 Student Services
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
